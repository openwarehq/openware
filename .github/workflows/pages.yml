name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A superseded run has nothing worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve the Pages base path
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it isn't already, rather than failing the run.
          # Without this the very first push to a fresh clone or fork dies
          # here with "Get Pages site failed".
          enablement: true

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Build static export
        env:
          # A project site is served from /<repo>; a custom domain from the
          # root. Reading this from Pages keeps it correct across a rename
          # and across adding a CNAME later.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
